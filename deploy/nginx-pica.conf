# PicaComic B/S 反向代理模板
# 将 picacg.example.com 换成你的域名；证书路径按实际修改。
#
# 认证二选一：
# A. 网关自带密码：注释掉 auth_basic 两行，在 /opt/pica/config.json 设置 password。
# B. nginx basic auth：保留下面两行，网关 config.password 留空（dev 模式），
#    但必须保证 pica-gateway 只监听 127.0.0.1。

server {
    listen 443 ssl;
    http2 on;
    server_name picacg.example.com;

    ssl_certificate     /etc/letsencrypt/live/picacg.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/picacg.example.com/privkey.pem;

    # auth_basic           "PicaComic";
    # auth_basic_user_file /etc/nginx/pica.htpasswd;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 隧道是流式的，必须关闭缓冲
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
